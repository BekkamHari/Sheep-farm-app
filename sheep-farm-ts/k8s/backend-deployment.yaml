
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sheep-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sheep-backend
  template:
    metadata:
      labels:
        app: sheep-backend
    spec:
      containers:
        - name: backend
          image: your-docker-registry/sheep-backend:latest
          ports:
            - containerPort: 4000
          env:
            - name: DB_HOST
              value: "postgres"
            - name: DB_NAME
              value: "sheepfarm"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASS
              value: "postgres"
---
apiVersion: v1
kind: Service
metadata:
  name: sheep-backend
spec:
  selector:
    app: sheep-backend
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
      name: http
