
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sheep-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sheep-frontend
  template:
    metadata:
      labels:
        app: sheep-frontend
    spec:
      containers:
        - name: frontend
          image: your-docker-registry/sheep-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: sheep-frontend
spec:
  selector:
    app: sheep-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      name: http
  type: LoadBalancer
